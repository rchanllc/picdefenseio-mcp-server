services:
  picdefenseio_mcp:
    build: .
    container_name: picdefenseio_mcp
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=6910
      - PICDEFENSE_API_BASE_URL=${PICDEFENSE_API_BASE_URL:-https://app.picdefense.io/api/v2}
    ports:
      - "6910:6910"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:6910/health',(r)=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
